<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puls-Graphen Übersicht</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f4f0;--surface:#fff;--surface2:#eeecea;
    --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
    --border:rgba(0,0,0,0.10);--accent:#A32D2D;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#1a1a18;--surface:#242421;--surface2:#2e2e2b;
    --text:#f0efe9;--text2:#a8a79f;--text3:#6b6a65;
    --border:rgba(255,255,255,0.10);
  }}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);
    padding:28px 20px;max-width:1000px;margin:0 auto;
  }
  h1{font-size:22px;font-weight:500;margin-bottom:4px}
  .sub{font-size:13px;color:var(--text2);margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{
    background:var(--surface);border:0.5px solid var(--border);
    border-radius:12px;overflow:hidden;
  }
  .card img{width:100%;display:block;background:#fff}
  .card-info{padding:12px 14px}
  .card-date{font-size:15px;font-weight:500;color:var(--text)}
  .card-time{font-size:13px;color:var(--accent);font-weight:500;margin-top:2px}
  .card-file{font-size:11px;color:var(--text3);margin-top:6px;word-break:break-all}
  .footer{font-size:12px;color:var(--text3);margin-top:24px;padding-top:16px;border-top:0.5px solid var(--border)}
</style>
</head>
<body>

<h1>Puls-Graphen Übersicht</h1>
<p class="sub">Alle Herzfrequenz-Charts, chronologisch sortiert · Datum &amp; Uhrzeit aus Screenshot-Dateiname</p>

<div class="grid" id="grid"></div>

<div class="footer">11 Puls-Graphen · Mai 2026 · Amazfit / Huami Watch Manager</div>

<script>
const data = [
  {file:"Screenshot_20260519_125938_com_huami_watch_hmwatchmanager.jpg", date:"19.05.2026", time:"12:59:38"},
  {file:"Screenshot_20260520_162810_com_huami_watch_hmwatchmanager.jpg", date:"20.05.2026", time:"16:28:10"},
  {file:"Screenshot_20260521_150926_com_huami_watch_hmwatchmanager.jpg", date:"21.05.2026", time:"15:09:26"},
  {file:"Screenshot_20260522_160537_com_huami_watch_hmwatchmanager.jpg", date:"22.05.2026", time:"16:05:37"},
  {file:"Screenshot_20260523_165232_com_huami_watch_hmwatchmanager.jpg", date:"23.05.2026", time:"16:52:32"},
  {file:"Screenshot_20260524_185055_com_huami_watch_hmwatchmanager.jpg", date:"24.05.2026", time:"18:50:55"},
  {file:"Screenshot_20260525_165205_com_huami_watch_hmwatchmanager.jpg", date:"25.05.2026", time:"16:52:05"},
  {file:"Screenshot_20260526_132158_com_huami_watch_hmwatchmanager.jpg", date:"26.05.2026", time:"13:21:58"},
  {file:"Screenshot_20260528_154504_com_huami_watch_hmwatchmanager.jpg", date:"28.05.2026", time:"15:45:04"},
  {file:"Screenshot_20260529_185712_com_huami_watch_hmwatchmanager.jpg", date:"29.05.2026", time:"18:57:12"},
  {file:"Screenshot_20260530_175028_com_huami_watch_hmwatchmanager.jpg", date:"30.05.2026", time:"17:50:28"},
];

const grid = document.getElementById('grid');
data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${d.file}" alt="Herzfrequenz-Chart ${d.date}" loading="lazy">
    <div class="card-info">
      <div class="card-date">${d.date}</div>
      <div class="card-time">${d.time} Uhr</div>
      <div class="card-file">${d.file}</div>
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
