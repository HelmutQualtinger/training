<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dauer vs. Watt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.4.0/plotly.min.js"></script>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:#e2e0da;--C1:#185FA5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--surface:#242421;--text:#f0efe9;--text2:#a8a79f;--text3:#6b6a65;
  --border:#3a3a36;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px 20px}
h1{font-size:18px;font-weight:600;margin:0 0 2px}
p.sub{font-size:13px;color:var(--text2);margin:0 0 20px}
#chart{max-width:960px;height:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-sizing:border-box}
#stats{max-width:960px;margin:14px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--text2);display:flex;gap:28px;flex-wrap:wrap}
#stats .stat-lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:2px}
#stats .stat-val{font-size:15px;color:var(--text);font-weight:600}
#stats .stat-val span{font-size:12px;font-weight:400;color:var(--text3);margin-left:2px}
</style>
</head>
<body>
<h1>Dauer vs. Watt</h1>
<p class="sub">31 Trainingseinheiten (ab August) &middot; Christopeit AX 4000 / Kinomap</p>
<div id="chart"></div>
<div id="stats"></div>
<script>
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const ink = isDark ? '#f0efe9' : '#1a1a18';
const ink2 = isDark ? '#a8a79f' : '#5f5e5a';
const grid = isDark ? '#3a3a36' : '#e2e0da';
const surface = isDark ? '#242421' : '#ffffff';
const accent = '#185FA5';

const sessions = [{"n":"69","date":"1.8","week":10,"dur":39.0,"watt":186,"kcal":416},{"n":"70","date":"1.8","week":10,"dur":30.0,"watt":169,"kcal":289},{"n":"71","date":"2.8","week":10,"dur":22.0,"watt":186,"kcal":236},{"n":"72","date":"2.8","week":10,"dur":26.0,"watt":161,"kcal":245},{"n":"73","date":"3.8","week":11,"dur":28.0,"watt":198,"kcal":323},{"n":"74","date":"3.8","week":11,"dur":26.0,"watt":195,"kcal":294},{"n":"75","date":"3.8","week":11,"dur":20.0,"watt":196,"kcal":224},{"n":"76","date":"4.8","week":11,"dur":32.0,"watt":197,"kcal":361},{"n":"77","date":"5.8","week":11,"dur":39.0,"watt":192,"kcal":424},{"n":"78","date":"6.8","week":11,"dur":40.0,"watt":178,"kcal":414},{"n":"79","date":"7.8","week":11,"dur":38.0,"watt":197,"kcal":436},{"n":"80","date":"9.8","week":11,"dur":32.0,"watt":203,"kcal":367},{"n":"81","date":"9.8","week":11,"dur":12.0,"watt":176,"kcal":126},{"n":"82","date":"10.8","week":12,"dur":34.0,"watt":178,"kcal":350},{"n":"83","date":"11.8","week":12,"dur":41.0,"watt":169,"kcal":398},{"n":"84","date":"13.8","week":12,"dur":28.0,"watt":197,"kcal":323},{"n":"85","date":"13.8","week":12,"dur":27.0,"watt":188,"kcal":287},{"n":"86","date":"14.8","week":12,"dur":38.0,"watt":195,"kcal":427},{"n":"87","date":"15.8","week":12,"dur":53.0,"watt":171,"kcal":518},{"n":"88","date":"16.8","week":12,"dur":28.0,"watt":196,"kcal":321},{"n":"89","date":"17.8","week":13,"dur":31.0,"watt":218,"kcal":384},{"n":"90","date":"18.8","week":13,"dur":52.0,"watt":179,"kcal":530},{"n":"91","date":"19.8","week":13,"dur":33.0,"watt":190,"kcal":359},{"n":"92","date":"19.8","week":13,"dur":19.0,"watt":222,"kcal":244},{"n":"93","date":"20.8","week":13,"dur":31.233,"watt":208,"kcal":373},{"n":"94","date":"21.8","week":13,"dur":30.867,"watt":215,"kcal":380},{"n":"95","date":"22.8","week":13,"dur":35.633,"watt":194,"kcal":398},{"n":"96","date":"23.8","week":13,"dur":33.533,"watt":196,"kcal":377},{"n":"97","date":"24.8","week":14,"dur":37.617,"watt":204,"kcal":440},{"n":"98","date":"25.8","week":14,"dur":49.7,"watt":195,"kcal":557},{"n":"99","date":"26.8","week":14,"dur":31.0,"watt":212,"kcal":378}];

const trace = {
  name: 'Einheiten',
  x: sessions.map(s => s.dur),
  y: sessions.map(s => s.watt),
  text: sessions.map(s => `#${s.n} · ${s.date} · ${s.kcal} kcal`),
  mode: 'markers',
  type: 'scatter',
  marker: { size: 9, color: accent, opacity: 0.75, line: { width: 1, color: surface } },
  hovertemplate: '%{text}<br>Dauer: %{x} min<br>Watt: %{y} W<extra></extra>'
};

const n = sessions.length;
const sumX = sessions.reduce((a, s) => a + s.dur, 0);
const sumY = sessions.reduce((a, s) => a + s.watt, 0);
const sumXY = sessions.reduce((a, s) => a + s.dur * s.watt, 0);
const sumXX = sessions.reduce((a, s) => a + s.dur * s.dur, 0);
const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
const intercept = (sumY - slope * sumX) / n;
const xMin = Math.min(...sessions.map(s => s.dur));
const xMax = Math.max(...sessions.map(s => s.dur));

const meanY = sumY / n;
const ssTot = sessions.reduce((a, s) => a + (s.watt - meanY) ** 2, 0);
const ssRes = sessions.reduce((a, s) => a + (s.watt - (slope * s.dur + intercept)) ** 2, 0);
const r2 = 1 - ssRes / ssTot;

const predDur = 60;
const predWatt = slope * predDur + intercept;

const fitTrace = {
  name: 'Trend',
  x: [xMin, xMax],
  y: [xMin, xMax].map(x => slope * x + intercept),
  mode: 'lines',
  type: 'scatter',
  line: { color: ink2, width: 2, dash: 'dot' },
  hoverinfo: 'skip'
};

const predTrace = {
  name: `Interpolation ${predDur} min`,
  x: [predDur],
  y: [predWatt],
  mode: 'markers',
  type: 'scatter',
  marker: { size: 13, color: 'rgba(0,0,0,0)', line: { width: 2, color: '#BA7517' }, symbol: 'circle' },
  hovertemplate: `Interpolation: ${predDur} min → ${predWatt.toFixed(1)} W<extra></extra>`
};

const layout = {
  height: 496,
  paper_bgcolor: surface,
  plot_bgcolor: surface,
  font: { family: '-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif', color: ink2, size: 12 },
  margin: { l: 55, r: 20, t: 10, b: 50 },
  xaxis: { title: { text: 'Dauer (min)', font: { color: ink2 } }, gridcolor: grid, zeroline: false, color: ink2 },
  yaxis: { title: { text: 'Watt', font: { color: ink2 } }, gridcolor: grid, zeroline: false, color: ink2 },
  hoverlabel: { bgcolor: surface, bordercolor: grid, font: { color: ink } },
  legend: { font: { color: ink2 }, bgcolor: 'rgba(0,0,0,0)', x: 1, xanchor: 'right', y: 1, yanchor: 'top' }
};

Plotly.newPlot('chart', [fitTrace, trace, predTrace], layout, { responsive: true, displayModeBar: false });

const sign = intercept >= 0 ? '+' : '&minus;';
document.getElementById('stats').innerHTML = `
  <div><div class="stat-lbl">Fit</div><div class="stat-val">Watt = ${slope.toFixed(3)}&times;Dauer ${sign} ${Math.abs(intercept).toFixed(1)}</div></div>
  <div><div class="stat-lbl">Steigung</div><div class="stat-val">${slope.toFixed(3)}<span>W/min</span></div></div>
  <div><div class="stat-lbl">R&sup2;</div><div class="stat-val">${r2.toFixed(3)}</div></div>
  <div><div class="stat-lbl">Interpolation bei 60 min</div><div class="stat-val">${predWatt.toFixed(1)}<span>W</span></div></div>
`;
</script>
</body>
</html>
