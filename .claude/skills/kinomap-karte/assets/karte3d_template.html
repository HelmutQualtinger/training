<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karte 3D</title>
<!--__SOCIAL__-->
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
:root{--surface:rgba(255,255,255,.9);--text:#1c1c1a;--muted:#5f5f5a;--border:rgba(0,0,0,.12);--accent:#c2410c}
@media (prefers-color-scheme: dark){:root{--surface:rgba(28,28,26,.88);--text:#ececE6;--muted:#a3a39c;--border:rgba(255,255,255,.14);--accent:#fb923c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bcd7ee;color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block;touch-action:none}
.panel{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
#top{top:12px;left:12px;max-width:calc(100% - 24px)}
#top h1{font-size:17px;margin:0}
#top .sub{color:var(--muted);font-size:12px}
#top a{color:var(--accent)}
button,select{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
#bottom{left:12px;right:556px;bottom:26px}
#bottom .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#scrub{flex:1;min-width:160px;accent-color:var(--accent)}
/* bike-computer cockpit: always dark, like a head unit */
#cockpit{position:fixed;right:12px;bottom:26px;width:532px;background:#0d0f12;border:1px solid #2a2e35;border-radius:16px;padding:10px 12px 8px;color:#f4f4f5;box-shadow:inset 0 0 0 3px #16191e}
#dials{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#dials svg{display:block;width:100%}
#cockpit .track{fill:none;stroke:#262a31;stroke-width:9;stroke-linecap:round}
#cockpit .val{fill:none;stroke-width:9;stroke-linecap:round}
#cockpit .tl{fill:#a1a7b3;font-size:8px;text-anchor:middle;dominant-baseline:central}
#cockpit .needle{stroke:#fff;stroke-width:3;stroke-linecap:round}
#cockpit .num{fill:#fff;font-size:24px;font-weight:700;text-anchor:middle;font-variant-numeric:tabular-nums}
#cockpit .unit{fill:#9aa1ad;font-size:9px;text-anchor:middle}
#cockpit .lab{fill:#d4d7dd;font-size:9px;font-weight:600;letter-spacing:.08em;text-anchor:middle;text-transform:uppercase}
#stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px;border-top:1px solid #2a2e35;padding-top:6px;text-align:center}
#stats .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9aa1ad}
#stats .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
#stats .v small{font-size:12px;font-weight:500;color:#9aa1ad}
@media (max-width:1000px){
  #bottom{right:12px}
  #cockpit{bottom:96px;width:min(532px,calc(100% - 24px))}
  #stats .v{font-size:17px}
}
@media (max-width:560px){#cockpit{bottom:132px}}
/* phones: cockpit at the top, right under the title; resize() sets its top and moves the rider's-eye inset below it */
@media (max-width:760px){#cockpit{bottom:auto;left:12px;right:12px;width:auto}}
label{font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
#left{position:fixed;top:12px;left:12px;width:430px;max-width:calc(100% - 24px);display:flex;flex-direction:column;gap:10px}
#left .panel{position:static;max-width:none}
#left{align-items:flex-start;pointer-events:none}
#left>*{pointer-events:auto;width:100%}
/* profile strip: dark like the cockpit, same series colours as its dials */
#profbox{background:#0d0f12;border:1px solid #2a2e35;border-radius:12px;padding:8px 10px}
#prof{display:block;width:100%;cursor:crosshair;touch-action:none}
@media (max-width:760px){#profbox{display:none}}
/* frame for the rider's-eye inset; the picture itself is a second viewport on the WebGL canvas */
#pov{position:fixed;top:12px;right:12px;width:min(400px,34vw);aspect-ratio:16/10;border:2px solid #0d0f12;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.5);pointer-events:none}
/* Every overlay panel gets a .bar from the script (label + minimise button). A panel is dragged by its bar or
   by any spot that isn't a control; "–" shrinks it to the bar alone. */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.bar .nm{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.mn{flex:none;width:18px;height:18px;padding:0;line-height:1;font-size:13px;border-radius:5px;color:inherit;border-color:currentColor;opacity:.6}
.mn:hover,.mn:focus-visible{opacity:1}
.float{cursor:grab}
#top,#cockpit{touch-action:none}
.min{width:auto!important;padding:5px 8px!important}
.min>:not(.bar){display:none!important}
.min .bar{margin:0}
#profbox{color:#f4f4f5}
/* title and controls: no label row while open, just the button at the right edge */
#top .bar{float:right;margin:0 0 0 10px}
#top.min .bar{float:none;margin:0}
#top:not(.min) .nm,#bottom:not(.min) .nm{display:none}
#bottom:not(.min){display:flex;align-items:center;gap:10px}
#bottom:not(.min) .row{flex:1;order:-1}
#bottom .bar{margin:0}
#bottom.min{right:auto}
#cockpit.min{left:auto}
#pov .bar{position:absolute;left:6px;right:6px;top:6px;margin:0;pointer-events:auto;color:#f4f4f5}
#pov .nm{background:rgba(13,15,18,.78);font-size:11px;font-weight:400;letter-spacing:.06em;padding:2px 7px;border-radius:999px;opacity:1}
#pov .mn{background:rgba(13,15,18,.78);opacity:1}
#pov.min{aspect-ratio:auto;border:0;box-shadow:none;padding:0!important}
#pov.min .bar{position:static}
body.rec .mn{display:none}
@media (max-width:760px){#pov{top:150px;width:46vw}}
body.rec #bottom{display:none}   /* ?rec: frame-by-frame capture, no playback controls */
#attr{position:fixed;right:12px;bottom:6px;font-size:11px;color:#333;text-shadow:0 0 3px #fff}
#attr a{color:inherit}
#hint{font-size:12px;color:var(--accent);margin-top:8px;max-width:400px}
</style>
</head>
<body>
<div id="left">
<div class="panel" id="top">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div id="hint" hidden>Kartenbild lädt nur über HTTP: im Repo <code>python3 -m http.server 8756</code> starten und <code id="hint-url"></code> öffnen.</div>
</div>

<div id="profbox"><canvas id="prof" aria-label="Verlauf von Tempo, Leistung, Puls und Höhe"></canvas></div>
</div>

<div id="pov"></div>

<div class="panel" id="bottom">
  <div class="row">
    <button id="play">▶ Abspielen</button>
    <select id="speed" aria-label="Tempo"><option value="10">10×</option><option value="30" selected>30×</option><option value="90">90×</option></select>
    <label><input type="checkbox" id="follow"> Mitfahren</label>
    <label><input type="checkbox" id="spin"> Drehen</label>
    <label><input type="checkbox" id="sound" checked> Ton</label>
    <input type="range" id="scrub" min="0" value="0" step="1" aria-label="Position auf der Strecke">
  </div>
</div>
<div id="cockpit" aria-label="Fahrradcomputer">
  <div id="dials"><div id="d-kmh"></div><div id="d-watt"></div><div id="d-hf"></div><div id="d-rpm"></div></div>
  <div id="stats">
    <div><div class="l">Distanz</div><div class="v"><span id="s-km"></span> <small>km</small></div></div>
    <div><div class="l">Zeit</div><div class="v" id="s-time"></div></div>
    <div><div class="l">Höhe</div><div class="v"><span id="s-ele"></span> <small>m</small></div></div>
  </div>
</div>
<div id="attr">Karte &amp; Gebäude © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende · Höhendaten: Mapzen Terrain Tiles</div>

<script type="application/json" id="data">/*__DATA__*/null</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';

// Heightmap, building footprints and track are baked into the JSON block above; only the ground
// texture (OSM tiles) is fetched live. Scene units are metres: x east, z south, y up.
const D=JSON.parse(document.getElementById('data').textContent);
const T=D.track,N=T.x.length;
const TITLE_SUFFIX=' in 3D',H1_SUFFIX=' in 3D',OTHER={file:D.meta.file2d,label:'2D-Karte'};
// D.meta comes from kinomap_karte.py: {title, sub, file2d, file3d}; set via textContent since the
// route name is whatever the Kinomap export says.
document.title=D.meta.title+TITLE_SUFFIX;
document.getElementById('title').textContent=D.meta.title+H1_SUFFIX;
{
  const sub=document.getElementById('sub'),a=document.createElement('a');
  a.href=OTHER.file;a.textContent=OTHER.label;
  sub.append(D.meta.sub+' · ',a);
}
document.getElementById('hint-url').textContent='http://localhost:8756/'+D.meta.file3d;
const params=new URLSearchParams(location.search);
const fmt=(v,d=0)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---- heightmap (uint16 decimetres above D.hmin, row 0 = north) ----
const hb=atob(D.H),H=new Uint16Array(hb.length/2);
for(let i=0;i<H.length;i++)H[i]=hb.charCodeAt(2*i)|hb.charCodeAt(2*i+1)<<8;
// Height of the terrain exactly as it is drawn: each grid cell is two flat triangles (split along the
// diagonal PlaneGeometry uses, south-west to north-east corner), not a smooth bilinear patch. Reading
// the smooth value instead puts things up to a few metres under the rendered ground in rough cells.
function hAt(x,z){
  const u=Math.min(D.nx-1.001,Math.max(0,(x/D.W+.5)*(D.nx-1)));
  const v=Math.min(D.ny-1.001,Math.max(0,(z/D.D+.5)*(D.ny-1)));
  const i=Math.floor(u),j=Math.floor(v),f=u-i,g=v-j,k=j*D.nx+i;
  const h00=H[k],h10=H[k+1],h01=H[k+D.nx],h11=H[k+D.nx+1];
  return (f+g<=1?h00+f*(h10-h00)+g*(h01-h00):h11+(1-f)*(h01-h11)+(1-g)*(h10-h11))/10;
}

// ---- renderer / scene ----
const SKY=0xbcd7ee;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:params.has('shot')||params.has('rec')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
const SPAN=Math.max(D.W,D.D);
scene.fog=new THREE.Fog(SKY,SPAN*0.75,Math.max(32000,SPAN*2.6));
const camera=new THREE.PerspectiveCamera(45,1,5,Math.max(60000,SPAN*5));
// start south-east of the route's centre, looking north across it
const mid={x:T.x.reduce((s,v)=>s+v,0)/N,z:T.z.reduce((s,v)=>s+v,0)/N};
camera.position.set(mid.x+SPAN*0.21,SPAN*0.26,mid.z+SPAN*0.63);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(mid.x,0,mid.z);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI/2-0.04;
controls.minDistance=4;controls.maxDistance=Math.max(26000,SPAN*2.1);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f80,1.3));
const sun=new THREE.DirectionalLight(0xfff4e0,2.5);   // strong enough that slopes read as relief
sun.position.set(-0.6,0.8,0.5);   // from the south-west, afternoon
scene.add(sun);

// ---- terrain ----
const tg=new THREE.PlaneGeometry(D.W,D.D,D.nx-1,D.ny-1);
tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position;
for(let i=0;i<H.length;i++)tp.setY(i,H[i]/10);
tg.computeVertexNormals();
// ---- vector ground (rides built with --vector) ----
// D.vt names a .pmtiles file next to the page: Protomaps basemap tiles (OpenStreetMap data) cut out of the
// planet build for this ride. The page paints them itself with canvas 2D — once into the area texture and
// again, much larger, into each sharper-ground patch near the rider. That is where vectors pay off: an OSM
// raster tile is 1.3 m per pixel at best, a vector tile is drawn at whatever resolution the patch has.
// Each tile becomes a handful of Path2D objects once (one per fill or stroke style, in the tile's own
// 0..4096 coordinates); painting it is then a transform plus a few fills and strokes.
const VEC=D.vt&&location.protocol!=='file:'?(async()=>{
  const CDN='https://cdn.jsdelivr.net/npm/';
  const [{PMTiles},{VectorTile},{default:Pbf}]=await Promise.all([
    import(CDN+'pmtiles@4.5.0/+esm'),import(CDN+'@mapbox/vector-tile@2.0.5/+esm'),import(CDN+'pbf@4.0.2/+esm')]);
  // The file is a few MB: fetched whole and read from memory, so the server needs no HTTP range support
  // (python's http.server has none).
  const buf=await(await fetch(D.vt.file)).arrayBuffer();
  const pm=new PMTiles({getKey:()=>D.vt.file,getBytes:async(o,l)=>({data:buf.slice(o,o+l)})});
  const zmax=(await pm.getHeader()).maxZoom,cache=new Map();
  const LAND={};   // landuse/landcover kind -> fill style
  for(const [k,v] of Object.entries({green:'park grass garden playground village_green recreation_ground meadow golf_course dog_park grassland zoo',
    wood:'wood forest scrub',pitch:'pitch stadium',grave:'cemetery',civic:'school university college kindergarten hospital',
    work:'industrial commercial retail railway',paved:'pedestrian platform pier',sand:'beach sand',farm:'farmland farm orchard allotments'}))
    for(const n of v.split(' '))LAND[n]=k;
  function prep(vt){
    const P={},names=[],trees=[],places=[];
    const add=(k,f,closed)=>{
      const p=P[k]||(P[k]=new Path2D()),g=f.loadGeometry();
      for(const ring of g){for(let i=0;i<ring.length;i++)i?p.lineTo(ring[i].x,ring[i].y):p.moveTo(ring[i].x,ring[i].y);if(closed)p.closePath();}
      return g;
    };
    const each=(n,fn)=>{const l=vt.layers[n];if(l)for(let i=0;i<l.length;i++){const f=l.feature(i);fn(f,f.properties);}};
    for(const n of ['landcover','landuse'])each(n,(f,p)=>{const k=LAND[p.kind];if(k&&f.type===3)add(k,f,true);});
    each('water',(f,p)=>{if(f.type===3)add('water',f,true);else if(f.type===2)add(p.kind==='river'||p.kind==='canal'?'river':'stream',f,false);});
    each('buildings',(f,p)=>{if(f.type===3&&p.kind==='building')add('bld',f,true);});
    each('roads',(f,p)=>{
      if(f.type!==2||p.is_tunnel||p.kind==='ferry')return;
      const d=p.kind_detail||'';
      if(p.kind==='rail'){if(d!=='subway')add('rail',f,false);return;}   // the metro runs underground
      const k=p.kind==='highway'?'hw':p.kind==='major_road'?(/^(primary|trunk)/.test(d)?'pri':'maj')
             :p.kind==='minor_road'?(d==='service'?'svc':'min'):p.kind==='path'?'path':null;
      if(!k)return;
      const g=add(k,f,false);
      if(p.name&&k!=='path'&&k!=='svc')for(const l of g)names.push({name:p.name,big:k!=='min',l});
    });
    each('pois',(f,p)=>{if(p.kind==='tree'){const q=f.loadGeometry()[0][0];trees.push(q.x,q.y);}});
    each('places',(f,p)=>{if(p.name&&f.type===1){const q=f.loadGeometry()[0][0];places.push({name:p.name,x:q.x,y:q.y});}});
    names.sort((a,b)=>b.big-a.big);   // main roads get their name first
    return {P,names,trees,places,lab:new Map()};
  }
  const tile=(z,x,y)=>{
    const key=z+'/'+x+'/'+y;
    if(!cache.has(key))cache.set(key,pm.getZxy(z,x,y).then(r=>r&&r.data?prep(new VectorTile(new Pbf(new Uint8Array(r.data)))):null));
    return cache.get(key);
  };
  // roads: [style, fill, edge, real width in metres, minimum width in canvas px]
  const ROADS=[['path','#fbf7ee','#c9bfad',2.5,0],['svc','#fff','#c9c0b2',4,0],['min','#fff','#bdb4a5',7,1.3],
               ['maj','#fff','#b3a998',11,2.2],['pri','#fde293','#cfa646',15,3],['hw','#fccf70','#c8922f',18,3.6]];
  // k: canvas px per tile unit, (ox,oy): where the tile's corner lands, mpp: metres per canvas px
  function paint(c,t,k,ox,oy,mpp){
    c.save();c.setTransform(k,0,0,k,ox,oy);c.lineJoin=c.lineCap='round';
    const near=mpp<1.5;
    const fill=(key,col)=>{if(t.P[key]){c.fillStyle=col;c.fill(t.P[key],'evenodd');}};
    const px=(m,min)=>Math.max(min,m/mpp);   // a width in metres as canvas px, but never thinner than `min`
    const line=(key,col,w)=>{if(t.P[key]&&w>=.6){c.strokeStyle=col;c.lineWidth=w/k;c.stroke(t.P[key]);}};
    fill('farm','#eef0d5');fill('work','#e6e1e4');fill('civic','#f2e8d8');fill('green','#cfe6b8');fill('wood','#b2d69c');
    fill('grave','#cfdcc4');fill('pitch','#b9dfa6');fill('sand','#f4ebc8');fill('paved','#e3dfe6');
    fill('water','#a6d1ee');line('stream','#a6d1ee',px(2,.8));line('river','#a6d1ee',px(8,1.2));
    fill('bld','#d8cfc5');line('bld','#bfb3a6',near?.8:0);
    const R=ROADS.filter(r=>px(r[3],r[4])>=1);   // footpaths and driveways only where they are a pixel wide
    for(const [key,,edge,m,min] of R)line(key,edge,px(m,min)+(near?1.6:1));
    for(const [key,col,,m,min] of R)line(key,col,px(m,min));
    if(mpp<.4){   // right at the rider: a dashed centre line on the main roads
      c.lineCap='butt';c.setLineDash([3/mpp/k,6/mpp/k]);
      line('maj','#cfc8ba',.25/mpp);line('pri','#fff',.25/mpp);line('hw','#fff',.25/mpp);
      c.setLineDash([]);c.lineCap='round';
    }
    line('rail','#8b8b94',px(1.6,1));
    c.restore();
  }
  const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
  // Street names for one tile, lettering `hu` tile units tall: straight text along the middle of a line that
  // is long and straight enough for it, and wholly inside the tile, so no neighbouring tile has to draw the
  // other half. Placed in tile units, so every patch size draws the same name at the same spot on the ground.
  function labels(c,t,hu){
    if(t.lab.has(hu))return t.lab.get(hu);
    const out=[];
    c.font=`600 100px ${FONT}`;
    for(const {name,big,l} of t.names){
      const tw=c.measureText(name).width/100*hu,cum=[0];
      let len=0;
      for(let i=1;i<l.length;i++)cum.push(len+=Math.hypot(l[i].x-l[i-1].x,l[i].y-l[i-1].y));
      if(len<tw*1.2)continue;
      const at=s=>{
        let i=1;while(i<l.length-1&&cum[i]<s)i++;
        const f=(s-cum[i-1])/((cum[i]-cum[i-1])||1);
        return [l[i-1].x+(l[i].x-l[i-1].x)*f,l[i-1].y+(l[i].y-l[i-1].y)*f];
      };
      const a=at((len-tw)/2),b=at((len+tw)/2);
      if(Math.hypot(b[0]-a[0],b[1]-a[1])<tw*.93)continue;   // too bendy for straight text
      const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2,r=tw/2+hu;
      if(x-r<0||y-r<0||x+r>4096||y+r>4096)continue;
      if(out.some(o=>Math.hypot(o.x-x,o.y-y)<(o.name===name?1800:(o.r+r)*.75)))continue;
      let ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(Math.abs(ang)>Math.PI/2)ang+=Math.PI;
      out.push({name,x,y,r,ang,big});
    }
    t.lab.set(hu,out);return out;
  }
  // list positions are in tile units (k px each), fs is the font size in px
  function write(c,list,k,ox,oy,fs,col='#4a4640'){
    c.font=`600 ${fs}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
    for(const o of list){
      c.save();c.translate(ox+o.x*k,oy+o.y*k);c.rotate(o.ang||0);
      c.lineWidth=fs*.28;c.strokeStyle='rgba(255,255,255,.9)';c.strokeText(o.name,0,0);
      c.fillStyle=col;c.fillText(o.name,0,0);c.restore();
    }
  }
  const BG='#e9e5da',LETTER=4,pause=()=>new Promise(r=>setTimeout(r));
  // the whole area, one texture tile after the other; PT = canvas px per tile
  async function area(c,PT,done){
    const mpp=D.W/D.tx/PT,k=PT/4096,fs=11*PT/256,pf=fs*1.2;
    for(let y=0;y<D.ty;y++)for(let x=0;x<D.tx;x++){
      const t=await tile(D.zt,D.x0+x,D.y0+y),ox=x*PT,oy=y*PT;
      c.save();c.beginPath();c.rect(ox,oy,PT,PT);c.clip();
      c.fillStyle=BG;c.fillRect(ox,oy,PT,PT);
      if(t)paint(c,t,k,ox,oy,mpp);
      c.restore();
      if(t){
        write(c,labels(c,t,fs/k).filter(o=>o.big),k,ox,oy,fs);
        c.font=`600 ${pf}px ${FONT}`;

  for(let v=min;v<=max;v+=step){const [x,y]=pt(A0+(v-min)/(max-min)*SW,R+11);ticks+=`<text x="${x}" y="${y}" class="tl">${v}</text>`;}
  const host=document.getElementById(id);
  host.innerHTML=`<svg viewBox="0 0 120 120" role="img" aria-label="${label}"><path d="${arc}" class="track"/>`+
    `<path d="${arc}" class="val" stroke="${color}"/>${ticks}<line class="needle" x1="${C+R-8}" y1="${C}" x2="${C+R+5}" y2="${C}"/>`+
    `<text x="60" y="67" class="num"></text><text x="60" y="79" class="unit">${unit}</text><text x="60" y="113" class="lab">${label}</text></svg>`;
  const val=host.querySelector('.val'),needle=host.querySelector('.needle'),num=host.querySelector('.num');
  return v=>{
    const f=Math.min(1,Math.max(0,(v-min)/(max-min)));
    val.setAttribute('stroke-dasharray',`${(f*L).toFixed(1)} ${L+20}`);
    val.style.visibility=f>0?'visible':'hidden';
    needle.setAttribute('transform',`rotate(${(A0+f*SW).toFixed(1)} ${C} ${C})`);
    num.textContent=fmt(v,d);
  };
}
const dials={
  kmh:dial('d-kmh',{min:0,max:60,step:10,label:'Tempo',unit:'km/h',color:'#38bdf8',d:1}),
  watt:dial('d-watt',{min:0,max:400,step:100,label:'Leistung',unit:'Watt',color:'#fb923c'}),
  hf:dial('d-hf',{min:60,max:160,step:20,label:'Puls',unit:'bpm',color:'#f87171'}),
  rpm:dial('d-rpm',{min:0,max:120,step:20,label:'Kadenz',unit:'rpm',color:'#a3e635'}),
};
function readout(){
  const i=Math.min(N-2,Math.floor(t)),f=t-i,v=k=>T[k][i]+(T[k][i+1]-T[k][i])*f,s=Math.round(t);
  for(const k in dials)dials[k](v(k));
  document.getElementById('s-km').textContent=fmt(v('dist')/1000,2);
  document.getElementById('s-time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  document.getElementById('s-ele').textContent=fmt(v('ele'));
  drawProf();
}
function setPlaying(p){playing=p;playBtn.textContent=p?'❚❚ Pause':'▶ Abspielen';}
// ---- sound: pedal strokes, chain whirr, breathing and heartbeat, synthesised (no audio files). Pedals,
// chain and heart follow the ride's real cadence and measured pulse, not the playback speed-up — at 30×
// the true rhythm would be a 45 Hz buzz. Breathing is stretched over this ride's own power range: its
// lowest watt reading breathes at BREATH[0] breaths per minute, its highest at BREATH[1]. ----
const soundBox=document.getElementById('sound');let au=null;
const BREATH=[14,50],WMIN=Math.min(...T.watt),WMAX=Math.max(...T.watt);
function audio(){                  // first call must come from a click: browsers block audio until then
  if(au){au.ctx.resume();return;}
  const ctx=new AudioContext(),sr=ctx.sampleRate,buf=ctx.createBuffer(1,sr*2,sr),ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;
  const master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  const drive=ctx.createGain();drive.gain.value=0;drive.connect(master);   // pedals + chain, silent while coasting
  // one band of noise whose loudness an oscillator swings between 0 and 1
  const voice=(type,freq,q,level,wave,dest)=>{
    const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=ctx.createGain();g.gain.value=.5;
    const o=ctx.createOscillator();o.type=wave;o.frequency.value=1;   // not the 440 Hz default: sound() glides from here
    const depth=ctx.createGain();depth.gain.value=.5;
    o.connect(depth).connect(g.gain);o.start();
    const out=ctx.createGain();out.gain.value=level;
    noise.connect(f).connect(g).connect(out).connect(dest);
    o.filter=f;o.out=out;
    return o;
  };
  const link=voice('bandpass',3200,1.2,.35,'sawtooth',drive);   // chain: a bright tick per link onto the chainring
  const stroke=voice('lowpass',420,.7,1.6,'sine',drive);        // pedals: a low whoosh per downstroke
  // breath: two swells per breath (in, out); a second oscillator at half that rate brightens the
  // inhale and darkens the exhale so the two are told apart
  const breath=voice('bandpass',1100,1.1,1,'sine',master);
  const tone=ctx.createOscillator(),toneDepth=ctx.createGain();toneDepth.gain.value=450;
  tone.frequency.value=.5;tone.connect(toneDepth).connect(breath.filter.frequency);tone.start();
  noise.start();
  au={ctx,master,drive,link,stroke,breath,tone,beat:0};
}
// one heart sound: a short sine thump that drops in pitch
function thump(at,f0,f1,level,len){
  const o=au.ctx.createOscillator(),g=au.ctx.createGain();
  o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(f1,at+len);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(level,at+.008);g.gain.exponentialRampToValueAtTime(.001,at+len);
  o.connect(g).connect(au.master);o.start(at);o.stop(at+len+.02);
}
function sound(){
  if(!au)return;
  const i=Math.min(N-2,Math.floor(t)),rpm=T.rpm[i],now=au.ctx.currentTime;
  const effort=(T.watt[i]-WMIN)/((WMAX-WMIN)||1);            // 0 at the ride's lowest power, 1 at its highest
  au.master.gain.setTargetAtTime(playing&&soundBox.checked?1:0,now,.08);
  au.drive.gain.setTargetAtTime(rpm>5?.25+.45*Math.min(1,T.watt[i]/300):0,now,.08);   // harder effort = louder
  if(rpm>5){
    au.stroke.frequency.setTargetAtTime(rpm/30,now,.1);        // two downstrokes per crank revolution
    au.link.frequency.setTargetAtTime(rpm/60*50,now,.1);       // 50-tooth chainring
  }
  // slow time constant: breathing lags behind the power, and at 30× the watts jump from frame to frame
  const hz=(BREATH[0]+(BREATH[1]-BREATH[0])*effort)/60;
  au.tone.frequency.setTargetAtTime(hz,now,.6);au.breath.frequency.setTargetAtTime(hz*2,now,.6);
  au.breath.out.gain.setTargetAtTime(.08+.17*effort,now,.6);   // and it gets heavier
  // heartbeat at the measured pulse: "lub-dub" per beat, queued a little ahead of the audio clock
  if(playing&&soundBox.checked){
    if(au.beat<now)au.beat=now+.02;
    while(au.beat<now+.15){
      const period=60/Math.max(40,T.hf[i]);
      thump(au.beat,95,45,.45,.13);thump(au.beat+Math.min(.3,period*.38),120,60,.3,.09);
      au.beat+=period;
    }
  }
}
soundBox.onchange=()=>{if(soundBox.checked&&playing)audio();};
document.addEventListener('visibilitychange',()=>{if(au)document.hidden?au.ctx.suspend():au.ctx.resume();});
playBtn.onclick=()=>{if(!playing&&t>=N-1)t=0;setPlaying(!playing);if(playing&&soundBox.checked)audio();};
scrub.oninput=()=>{t=+scrub.value;readout();};
readout();

// ---- overlay panels: drag to move, "–" to minimise ----
// A dragged panel keeps its CSS position and is shifted with `translate`, so the responsive layout and the
// phone stacking in resize() stay in charge; place() only keeps the panel inside the window.
const offs=new Map();let zTop=1;
function place(el){
  const o=offs.get(el);
  el.style.translate=o.x+'px '+o.y+'px';
  const r=el.getBoundingClientRect();
  const dx=r.left<0?-r.left:Math.min(0,innerWidth-r.right),dy=r.top<0?-r.top:Math.min(0,innerHeight-r.bottom);
  if(dx||dy){o.x+=dx;o.y+=dy;el.style.translate=o.x+'px '+o.y+'px';}
}
for(const [id,name] of [['top','Fahrt'],['profbox','Verlauf'],['pov','Fahrersicht'],['bottom','Steuerung'],['cockpit','Cockpit']]){
  const el=document.getElementById(id),bar=document.createElement('div'),nm=document.createElement('span'),btn=document.createElement('button');
  bar.className='bar';nm.className='nm';nm.textContent=name;btn.className='mn';btn.type='button';
  bar.append(nm,btn);el.prepend(bar);el.classList.add('float');
  const o={x:0,y:0};offs.set(el,o);
  const label=()=>{
    const m=el.classList.contains('min');
    btn.textContent=m?'+':'–';btn.title=name+(m?' einblenden':' minimieren');btn.setAttribute('aria-label',btn.title);
  };
  label();
  btn.addEventListener('click',()=>{el.classList.toggle('min');label();resize();});
  let grab=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button||e.target.closest('button,select,input,a,label,canvas'))return;
    grab={x:e.clientX-o.x,y:e.clientY-o.y};e.target.setPointerCapture(e.pointerId);e.preventDefault();
    (el.closest('#left')||el).style.zIndex=++zTop;   // the grabbed panel comes to the front
  });
  el.addEventListener('pointermove',e=>{if(grab){o.x=e.clientX-grab.x;o.y=e.clientY-grab.y;place(el);}});
  for(const ev of ['pointerup','pointercancel'])el.addEventListener(ev,()=>{grab=null;});
  bar.addEventListener('dblclick',e=>{if(e.target!==btn){o.x=o.y=0;place(el);}});   // double-click the bar: back to its home position
}

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  for(const m of [lineMat,casingMat,ghostMat])m.resolution.set(w,h);
  // phones: stack title, cockpit and rider's-eye inset from the top, leaving the lower screen to the scene
  const mob=matchMedia('(max-width:760px)').matches,ck=document.getElementById('cockpit');
  ck.style.top=mob?document.getElementById('left').getBoundingClientRect().bottom+8+'px':'';
  document.getElementById('pov').style.top=mob?ck.offsetTop+ck.offsetHeight+8+'px':'';   // layout box, not the dragged one
  for(const el of offs.keys())place(el);
}
addEventListener('resize',resize);resize();

// From road level the area texture (≈3 m per pixel) is mush, so the ground around the rider gets
// tiles two zoom levels deeper, draped as small patches and fetched lazily as the ride progresses.
const HF=4,patches=new Set(),PATCH=matchMedia('(max-width:760px)').matches?256:512;let inflight=0;
// drape one texture over cell (i,j) of an n×n-per-tile grid, following the ground `lift` metres above it
function drape(i,j,w,h,tx,lift,off){
  tx.colorSpace=THREE.SRGBColorSpace;
  tx.anisotropy=renderer.capabilities.getMaxAnisotropy();tx.needsUpdate=true;
  const seg=Math.min(32,Math.max(6,Math.ceil(2*w/(D.W/(D.nx-1)))));   // two per terrain cell, so the patch hugs the ground
  const g=new THREE.PlaneGeometry(w,h,seg,seg);g.rotateX(-Math.PI/2);g.translate(-D.W/2+(i+.5)*w,0,-D.D/2+(j+.5)*h);
  const a=g.attributes.position;
  for(let k=0;k<a.count;k++)a.setY(k,hAt(a.getX(k),a.getZ(k))+lift);
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:tx,polygonOffset:true,polygonOffsetFactor:off,polygonOffsetUnits:off}));
  scene.add(m);return m;
}
function sharpen(p){
  if(location.protocol==='file:')return;
  const nx=D.tx*HF,ny=D.ty*HF,w=D.W/nx,h=D.D/ny;
  const u=Math.floor((p.x/D.W+.5)*nx),v=Math.floor((p.z/D.D+.5)*ny);
  for(let j=v-2;j<=v+2;j++)for(let i=u-2;i<=u+2;i++){
    const key=i+'_'+j;
    if(i<0||j<0||i>=nx||j>=ny||patches.has(key)||inflight>=8)continue;
    patches.add(key);inflight++;
    if(VEC){   // vector ground: painted here, 512 px per cell (0.7 m per pixel); phones get half of that
      VEC.then(v=>v.patch(i,j,PATCH,HF)).then(c=>{inflight--;drape(i,j,w,h,new THREE.CanvasTexture(c),0.12,-2);},
                                              e=>{inflight--;console.error('Vektorkachel:',e);});
      continue;
    }
    const img=new Image();img.crossOrigin='anonymous';
    img.onerror=()=>{inflight--;};
    img.onload=()=>{inflight--;drape(i,j,w,h,new THREE.Texture(img),0.12,-2);};
    img.src=`https://tile.openstreetmap.org/${D.zt+2}/${D.x0*HF+i}/${D.y0*HF+j}.png`;
  }
}
// Vector ground only: two finer rings right under the rider — 16 and 64 cells per texture tile, each cell
// painted at 512 px (about 0.2 m and 4 cm per pixel), which raster tiles have no zoom levels for. They would
// add up to thousands of textures over a ride, so cells the rider has left behind are removed again; and the
// innermost ring only gets its turn while little else is waiting, so fast playback doesn't drown in it.
const RINGS=[{hf:16,lift:.13,off:-4,busy:8,cells:new Map()},{hf:64,lift:.14,off:-6,busy:4,cells:new Map()}];
function sharpenFine(p){
  if(!VEC)return;
  for(const R of RINGS){
    const nx=D.tx*R.hf,ny=D.ty*R.hf,w=D.W/nx,h=D.D/ny;
    const u=Math.floor((p.x/D.W+.5)*nx),v=Math.floor((p.z/D.D+.5)*ny);
    for(let j=v-2;j<=v+2;j++)for(let i=u-2;i<=u+2;i++){
      const key=i+'_'+j;
      if(i<0||j<0||i>=nx||j>=ny||R.cells.has(key)||inflight>=R.busy)continue;
      R.cells.set(key,null);inflight++;
      VEC.then(v=>v.patch(i,j,PATCH,R.hf)).then(c=>{inflight--;R.cells.set(key,drape(i,j,w,h,new THREE.CanvasTexture(c),R.lift,R.off));},
                                                e=>{inflight--;R.cells.delete(key);console.error('Vektorkachel:',e);});
    }
    for(const [key,m] of R.cells){
      const [i,j]=key.split('_').map(Number);
      if(!m||(Math.abs(i-u)<=5&&Math.abs(j-v)<=5))continue;
      scene.remove(m);m.geometry.dispose();m.material.map.dispose();m.material.dispose();R.cells.delete(key);
    }
  }
}

const povBox=document.getElementById('pov'),povCam=new THREE.PerspectiveCamera(72,1.6,0.3,camera.far);
const pos=new THREE.Vector3(),a1=new THREE.Vector3(),a0=new THREE.Vector3(),
      dir=new THREE.Vector3(0,0,-1),want=new THREE.Vector3(),eye=new THREE.Vector3(),look=new THREE.Vector3();
let last=performance.now(),first=false,snapDir=true,crank=0,lastD=null,chaseReset=false;
const FREE_MAX=controls.maxDistance,_up=new THREE.Vector3(0,1,0),_off=new THREE.Vector3(),_tgt=new THREE.Vector3();
// "Mitfahren" = wide-angle chase camera that starts 30 m behind and 5 m above the rider and stays locked
// onto them: drag to circle around the rider, wheel/pinch to zoom, no panning. Otherwise free orbit camera.
function setFirstPerson(on){
  first=on;chaseReset=on;
  controls.enablePan=!on;controls.minDistance=on?2.5:4;controls.maxDistance=on?600:FREE_MAX;
  camera.near=on?0.3:5;camera.fov=on?78:45;camera.updateProjectionMatrix();
  line.position.y=casing.position.y=on?-2.6:0;ghost.visible=!on;   // see-through pass would draw across the rider    // route line down to road level when seen from the saddle
  if(!on){                                        // hand back to the orbit camera just behind the rider
    controls.target.copy(pos);
    camera.position.copy(pos).addScaledVector(dir,-60).setY(pos.y+30);
  }
}
followBox.onchange=()=>setFirstPerson(followBox.checked);
// "Drehen": the camera circles on its own — around the rider in Mitfahren, around the view centre otherwise.
// One lap takes about 40 s; dragging and zooming still work while it turns.
const spinBox=document.getElementById('spin');
controls.autoRotateSpeed=1.5;
spinBox.onchange=()=>{controls.autoRotate=spinBox.checked;};
spinBox.checked=controls.autoRotate=params.has('spin');
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){
    t+=dt*+speedSel.value;
    if(t>=N-1){t=N-1;setPlaying(false);}
    scrub.value=Math.round(t);readout();
  }
  sound();
  const d=distAt(t);
  atDist(d,pos);
  // heading: smoothed direction of travel
  const yaw0=Math.atan2(dir.x,dir.z);
  atDist(d+10,a1).sub(atDist(d-4,a0)).setY(0);
  if(a1.lengthSq()>.01){a1.normalize();dir.lerp(a1,snapDir?1:1-Math.exp(-dt*5)).normalize();snapDir=false;}
  // wheels and legs turn with the distance covered (≈ 6 m per crank revolution)
  if(lastD!==null){const dd=d-lastD;for(const w of wheels)w.rotation.x+=dd/WR;crank-=dd/6*Math.PI*2;}
  lastD=d;pedal(crank);
  // true size close up (as in Mitfahren at its starting distance); enlarged so it stays visible from afar
  const rs=Math.max(1,camera.position.distanceTo(pos)/(first?34:28));
  rider.scale.setScalar(rs);
  // Keep both wheels on the ground: the bike is pitched along the slope between the two contact points
  // (the wheelbase grows with the enlarged overview rider), and lifted clear of the sharper-ground
  // patches, which lie 0.12 m above the terrain.
  const wb=0.52*rs,hR=hAt(pos.x-dir.x*wb,pos.z-dir.z*wb),hF=hAt(pos.x+dir.x*wb,pos.z+dir.z*wb);
  rider.position.copy(pos).setY(Math.max(pos.y,(hR+hF)/2)+0.15);
  rider.lookAt(look.copy(rider.position).add(dir).setY(rider.position.y+(hF-hR)/(2*wb)));
  if(first){
    sharpen(pos);
    _tgt.copy(pos).setY(pos.y+1.2);
    if(chaseReset){                                 // (re)start behind the rider
      chaseReset=false;
      camera.position.copy(pos).addScaledVector(dir,-30).setY(pos.y+5);
    }else{
      // carry the camera along with the rider and turn it with the road, so whatever angle and
      // distance the user has dragged/zoomed to is kept relative to the direction of travel
      _off.subVectors(camera.position,controls.target).applyAxisAngle(_up,Math.atan2(dir.x,dir.z)-yaw0);
      camera.position.copy(_tgt).add(_off);
    }
    controls.target.copy(_tgt);
    controls.update(dt);
    const floor=hAt(camera.position.x,camera.position.z)+1;      // never dip into a hillside
    if(camera.position.y<floor){camera.position.y=floor;camera.lookAt(_tgt);}
  }else{
    controls.update(dt);
    if(camera.position.distanceTo(controls.target)<1500)sharpen(controls.target);   // zoomed in: sharper ground there too
  }
  renderer.render(scene,camera);

  // inset top right: the road from the rider's eyes (1.6 m up, looking ahead), drawn into the #pov frame
  sharpen(pos);sharpenFine(pos);
  if(povBox.classList.contains('min'))return;   // minimised: no picture to draw
  const r=povBox.getBoundingClientRect(),vy=innerHeight-r.bottom;
  eye.copy(pos).addScaledVector(dir,0.22).setY(pos.y+1.6);
  povCam.position.copy(eye);
  povCam.lookAt(look.copy(eye).addScaledVector(dir,10).setY(eye.y-1.6));
  if(povCam.aspect!==r.width/r.height){povCam.aspect=r.width/r.height;povCam.updateProjectionMatrix();}
  rider.visible=ghost.visible=false;                 // the avatar may be enlarged for the main view
  line.position.y=casing.position.y=-2.6;            // route line at road level
  for(const m of [lineMat,casingMat])m.resolution.set(r.width,r.height);
  renderer.setViewport(r.left,vy,r.width,r.height);renderer.setScissor(r.left,vy,r.width,r.height);
  renderer.setScissorTest(true);
  renderer.render(scene,povCam);
  renderer.setScissorTest(false);renderer.setViewport(0,0,innerWidth,innerHeight);
  for(const m of [lineMat,casingMat])m.resolution.set(innerWidth,innerHeight);
  line.position.y=casing.position.y=first?-2.6:0;
  rider.visible=true;ghost.visible=!first;
}
if(followBox.checked)setFirstPerson(true);
if(params.has('close')){   // debug: start the orbit camera next to the rider
  atDist(distAt(t),pos);controls.target.copy(pos).setY(pos.y+1);
  camera.position.set(pos.x+(+params.get('close')||6),pos.y+2.5,pos.z+4);
}
// ?rec hands the clock to scripts/record_video.py: no animation loop, window.__step(rideSeconds)
// advances the ride, renders exactly one frame and reports whether the end is reached.
if(params.has('rec')){
  document.body.classList.add('rec');
  let fake=0;last=0;tick(0);
  window.__step=d=>{t=Math.min(N-1,t+d);readout();fake+=1000/30;tick(fake);return t>=N-1;};
}else renderer.setAnimationLoop(tick);
</script>
